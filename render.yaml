# ResearchX Render Blueprint
# Dashboard → New → Blueprint → this repo
# Paste secrets when prompted (sync: false). Never commit API keys.

previewsEnabled: false

envVarGroups:
  - name: researchx-shared
    envVars:
      - key: AI_SERVICE_TOKEN
        generateValue: true

services:
  # ── AI (FastAPI + Groq) ─────────────────────────────────
  # Native Python (free plan). Reads $PORT via app.api.run_prod.
  - type: web
    name: researchx-ai
    runtime: python
    plan: free
    region: oregon
    rootDir: apps/ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.api.run_prod
    healthCheckPath: /health
    envVars:
      - fromGroup: researchx-shared
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: APP_ENV
        value: production
      - key: MOCK_MODE
        value: "false"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: SEARCH_PROVIDER
        value: tavily
      - key: SEARCH_FALLBACK
        value: duckduckgo
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CACHE_PATH
        value: ./data/cache
      - key: OUTPUT_PATH
        value: ./data/outputs
      - key: DOCUMENTS_PATH
        value: ./data/documents
      - key: CHROMA_PATH
        value: ./data/chroma
      - key: MAX_SOURCES
        value: "10"
      - key: MAX_RESEARCH_ITERATIONS
        value: "1"
      - key: MAX_CONCURRENT_AGENTS
        value: "2"
      - key: MAX_CONCURRENT_RESEARCH
        value: "1"
      - key: MAX_CONCURRENT_RESEARCH_JOBS
        value: "1"
      - key: MAX_LLM_CALLS
        value: "30"

  # ── Express API ─────────────────────────────────────────
  - type: web
    name: researchx-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build -w researchx-server
    startCommand: npm start -w researchx-server
    healthCheckPath: /health
    envVars:
      - fromGroup: researchx-shared
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FASTAPI_URL
        fromService:
          name: researchx-ai
          type: web
          property: host
      - key: CORS_ORIGIN
        sync: false
      - key: ALLOW_MOCK_MODE
        value: "true"
      - key: ALLOW_EVALUATION
        value: "false"
      - key: DOCUMENTS_PATH
        value: ./data/documents

  # ── React SPA ───────────────────────────────────────────
  - type: web
    name: researchx-web
    runtime: static
    buildCommand: npm ci && npm run build -w researchx-web
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
