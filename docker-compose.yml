# ResearchX local stack
# docker compose up --build
# docker compose down -v

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  ai-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      MOCK_MODE: ${MOCK_MODE:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-duckduckgo}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      REDIS_URL: redis://redis:6379/0
      CHROMA_PATH: ./data/chroma
      CACHE_PATH: ./data/cache
      OUTPUT_PATH: ./data/outputs
      # Shared with Express for PDF RAG
      DOCUMENTS_PATH: /data/documents
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
    volumes:
      - ./data:/repo/data
      - ./data/documents:/data/documents
      - ./evaluation:/repo/evaluation
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  server:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: "5000"
      MONGODB_URI: mongodb://mongodb:27017/researchx
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-32chars-min}
      JWT_EXPIRES_IN: 7d
      FASTAPI_URL: http://ai-service:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
      REDIS_URL: redis://redis:6379/1
      DOCUMENTS_PATH: /data/documents
      ALLOW_MOCK_MODE: "true"
      ALLOW_EVALUATION: "true"
    volumes:
      - ./data/documents:/data/documents
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:5000}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongodb_data:
