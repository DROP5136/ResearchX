# ResearchX local stack
services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  ai-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.ai-service
    ports:
      - "8000:8000"
    env_file:
      - apps/ai-service/.env
    volumes:
      - ./data:/app/data
      - ./evaluation:/app/evaluation
    depends_on: []

  server:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.server
    ports:
      - "5000:5000"
    env_file:
      - apps/server/.env
    environment:
      FASTAPI_URL: http://ai-service:8000
      MONGODB_URI: mongodb://mongodb:27017/researchx
    depends_on:
      - mongodb
      - ai-service

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongodb_data:
